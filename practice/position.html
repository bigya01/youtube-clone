<html lang="en">
<head>

    <title>Position</title>
</head>
<body style= "height:1000px;
padding-top: 60px;
padding-left: 80px;
">

        background-color: lightsalmon;
    color:white;
    position:fixed;
    top:0px;
    left:0px;
    right:0px;
    height: 50px;
    "
    >header</div>

    style="
        background-color: rgb(73, 152, 76);
    color:white;
    position:fixed;
    width: 72px;
    
    bottom: 0;
    left:0;
    top: 50px;
    "

    
    
    >sidebar</div>



    <div
    style="
        background-color: rgb(172, 34, 98);
    color:white;

    width: 72px;
    
    
    left:0;
    top: 0;
    "

    
    
    >position absolute</div>





    <div style="
        background-color: lightblue;

        ">div1</div>
    <div
    style="
        background-color: lightpink;

"
    >div2

    
    <div
    style="
        background-color: rgb(172, 34, 98);

</div>
